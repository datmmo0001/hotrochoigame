name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải file về máy chủ
        uses: actions/checkout@v4

      - name: 2. Tự động giải nén code từ README.md
        run: bash README.md

      - name: 3. Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Cài đặt Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 5. Đóng gói ra file APK
        run: gradle assembleDebug

      - name: 6. Xuất file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: AutoClick-APK
          path: app/build/outputs/apk/debug/app-debug.apk
